<p style="margin: 0">사회적가치투자(SIR, Social Investor Relations) 대회는 이들의 활동을 시민이 직접 듣고 모의투자해, 실제 자원으로 잇는 <strong style="color: #E9C77A">시민 참여형 행사</strong>입니다. 재무 성과나 전문가 심사를 중심에 두는 기존 IR과 달리, 계속되길 바라는 변화를 시민이 고르고 그 선택이 실제 투자금이 됩니다.</p>

<h2 id="faq-title" style="margin: 0; font-size: clamp(32px, 4.4vw, 48px); font-weight: 900; line-height: 1.3; color: #1E8A44">자주 묻는 질문</h2>

</div>
<div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<div role="group" aria-label="질문 분류" style="display: flex; flex-wrap: wrap; gap: 8px"><button type="button" onClick="{{tab_info}}" aria-pressed="{{on_info}}" style="min-height: 44px; padding: 0 20px; border-radius: 999px; border: 2px solid #0E4419; background: {{bg_info}}; color: {{fg_info}}; font: inherit; font-size: 15px; font-weight: 800; cursor: pointer">행사 안내</button><button type="button" onClick="{{tab_site}}" aria-pressed="{{on_site}}" style="min-height: 44px; padding: 0 20px; border-radius: 999px; border: 2px solid #0E4419; background: {{bg_site}}; color: {{fg_site}}; font: inherit; font-size: 15px; font-weight: 800; cursor: pointer">현장 안내</button></div>
<sc-if value="{{on_info}}" hint-placeholder-val="{{true}}"><div style="display: flex; flex-direction: column; border-bottom: 1px solid #DCCAA0"><details style="border-top: 1px solid #DCCAA0; padding: 4px 0"><summary style="cursor: pointer; min-height: 44px; display: flex; align-items: center; font-size: 18px; font-weight: 800; padding: 14px 0">참가비가 있나요?</summary><p style="margin: 0 0 20px; font-size: 16px; line-height: 1.7; color: #4F4A3C; word-break: keep-all">없습니다. SIR대회는 <b>무료</b>로 참여할 수 있습니다.</p></details><details style="border-top: 1px solid #DCCAA0; padding: 4px 0"><summary style="cursor: pointer; min-height: 44px; display: flex; align-items: center; font-size: 18px; font-weight: 800; padding: 14px 0">임팩트코인은 실제 돈인가요?</summary><p style="margin: 0 0 20px; font-size: 16px; line-height: 1.7; color: #4F4A3C; word-break: keep-all">아닙니다. 임팩트코인은 행사에서만 쓰는 <b>가상의 모의투자금</b>입니다. 소셜투자자 한 분께 청년 트랙 100만 원, 지역소멸대응 트랙 100만 원, 모두 200만 원이 지급됩니다. 대신 현장 소셜투자자의 모의투자 결과에 따라 총 4천만 원의 실제 투자금이 출전팀에게 나뉩니다.</p></details><details style="border-top: 1px solid #DCCAA0; padding: 4px 0"><summary style="cursor: pointer; min-height: 44px; display: flex; align-items: center; font-size: 18px; font-weight: 800; padding: 14px 0">사회적가치도, 투자도 잘 모르는데 참여할 수 있나요?</summary><p style="margin: 0 0 20px; font-size: 16px; line-height: 1.7; color: #4F4A3C; word-break: keep-all">그럼요! 전문지식은 필요하지 않습니다. 전시와 발표를 보고, 소셜디자이너에게 직접 질문한 뒤 내가 중요하게 생각하는 가치를 기준으로 고르면 됩니다.</p></details><details style="border-top: 1px solid #DCCAA0; padding: 4px 0"><summary style="cursor: pointer; min-height: 44px; display: flex; align-items: center; font-size: 18px; font-weight: 800; padding: 14px 0">나이나 지역, 직업 제한이 있나요?</summary><p style="margin: 0 0 20px; font-size: 16px; line-height: 1.7; color: #4F4A3C; word-break: keep-all">없습니다. 지역·사회문제와 새로운 변화에 관심 있는 시민이라면 누구나 소셜투자자가 될 수 있습니다.</p></details><details style="border-top: 1px solid #DCCAA0; padding: 4px 0"><summary style="cursor: pointer; min-height: 44px; display: flex; align-items: center; font-size: 18px; font-weight: 800; padding: 14px 0">모집 인원이 다 차면 어떻게 되나요?</summary><p style="margin: 0 0 20px; font-size: 16px; line-height: 1.7; color: #4F4A3C; word-break: keep-all">소셜투자자는 선착순 200명으로 모집합니다. 마감 뒤 신청하면 대기 명단에 등록되고, 취소한 자리가 생기면 순서대로 참여를 안내해 드립니다.</p></details><details style="border-top: 1px solid #DCCAA0; padding: 4px 0"><summary style="cursor: pointer; min-height: 44px; display: flex; align-items: center; font-size: 18px; font-weight: 800; padding: 14px 0">여러 명(단체)으로도 참여할 수 있나요?</summary><p style="margin: 0 0 20px; font-size: 16px; line-height: 1.7; color: #4F4A3C; word-break: keep-all">가능합니다! 작년에도 학교, 직장, 동아리 단위로 함께 온 분들이 많았습니다. 다만 신청은 한 사람씩 따로 해 주세요. (예: 3명이 함께 올 경우 → 각자 1명씩 신청)</p></details><details style="border-top: 1px solid #DCCAA0; padding: 4px 0"><summary style="cursor: pointer; min-height: 44px; display: flex; align-items: center; font-size: 18px; font-weight: 800; padding: 14px 0">신청을 취소하고 싶어요.</summary><p style="margin: 0 0 20px; font-size: 16px; line-height: 1.7; color: #4F4A3C; word-break: keep-all">신청 확정 메일의 불참 버튼을 눌러 주세요. 비워진 자리는 대기자에게 넘어갑니다.</p></details></div></sc-if>

<sc-if value="{{on_site}}" hint-placeholder-val="{{false}}"><div style="display: flex; flex-direction: column; border-bottom: 1px solid #DCCAA0"><details style="border-top: 1px solid #DCCAA0; padding: 4px 0"><summary style="cursor: pointer; min-height: 44px; display: flex; align-items: center; font-size: 18px; font-weight: 800; padding: 14px 0">행사장은 어디인가요?</summary><p style="margin: 0 0 20px; font-size: 16px; line-height: 1.7; color: #4F4A3C; word-break: keep-all">대한상공회의소 국제회의장(서울 중구 세종대로 39, 지하 2층)입니다. 지하철 1·2호선 시청역 9번 출구에서 걸어서 5분 거리입니다.</p></details><details style="border-top: 1px solid #DCCAA0; padding: 4px 0"><summary style="cursor: pointer; min-height: 44px; display: flex; align-items: center; font-size: 18px; font-weight: 800; padding: 14px 0">주차할 수 있나요?</summary><p style="margin: 0 0 20px; font-size: 16px; line-height: 1.7; color: #4F4A3C; word-break: keep-all">주차는 지원하지 않습니다. 시청역 등 대중교통을 이용해 주세요. 아래 지도 링크에서 길찾기를 이용할 수 있습니다.</p></details><details style="border-top: 1px solid #DCCAA0; padding: 4px 0"><summary style="cursor: pointer; min-height: 44px; display: flex; align-items: center; font-size: 18px; font-weight: 800; padding: 14px 0">입장은 어떻게 하나요?</summary><p style="margin: 0 0 20px; font-size: 16px; line-height: 1.7; color: #4F4A3C; word-break: keep-all">13:00부터 입장할 수 있습니다. 입장 QR을 체크인 키오스크에 보여 주시면 명찰과 소셜투자자 키트를 받을 수 있습니다.</p></details><details style="border-top: 1px solid #DCCAA0; padding: 4px 0"><summary style="cursor: pointer; min-height: 44px; display: flex; align-items: center; font-size: 18px; font-weight: 800; padding: 14px 0">현장에서 문자통역이 제공되나요?</summary><p style="margin: 0 0 20px; font-size: 16px; line-height: 1.7; color: #4F4A3C; word-break: keep-all">네. 무대 발표는 문자통역으로 함께 볼 수 있습니다.</p></details><details style="border-top: 1px solid #DCCAA0; padding: 4px 0"><summary style="cursor: pointer; min-height: 44px; display: flex; align-items: center; font-size: 18px; font-weight: 800; padding: 14px 0">현장 촬영이 있나요?</summary><p style="margin: 0 0 20px; font-size: 16px; line-height: 1.7; color: #4F4A3C; word-break: keep-all">기록과 홍보를 위해 사진·영상을 촬영합니다.</p></details><div style="display: flex; flex-wrap: wrap; gap: 10px; padding: 20px 0 8px">

const TEAMS = [{"id": "jgnu", "track": "y", "n": "01", "team": "제주농업인플랫폼", "reg": "제주", "who": "이원재", "q": "제주의 농사 정보, 왜 아는 사람만 알고 있을까?", "tags": "#청년농부 #정보격차 #농가연결 #농업교육 #소통", "one": "농사 정보가 아는 사람 사이에서만 도는 제주에서, 농업인끼리 묻고 답하는 소통방과 현장 교육을 꾸립니다.", "why": ["감귤 등 농업 기반이 탄탄하지만, 농가 간 거리가 멀고 고령 농업인이 많아 정보가 사람 관계로 전해집니다.", "농업과 가공, 유통, 관광을 이으면 새로운 기회를 만들 수 있는 지역입니다."], "meet": ["운영자가 정보를 나눠 주는 대신, 농업인이 서로의 경험으로 답합니다.", "농업인이 제안한 주제가 다음 교육이 되고, 지역 기업·청년·전문가가 필요한 자리에 연결됩니다."], "inv": "농업에 관심 있는 시민과 예비·초보 농업인이 농장에 와서 직접 배우는 현장 교육장을 만들고, 온라인 교육도 함께 엽니다.", "links": "jejugnu.com", "page": "10", "url": "https://makehope.org/sd-interview/?bmode=view&idx=175213955", "photo": "images/sd_jgnu.jpg"}, {"id": "jaejakso", "track": "y", "n": "02", "team": "㈜재작소", "reg": "대전 유성구", "who": "조미림", "q": "버리지 않고 함께 고쳐 쓰다 보면 청년도 동네와 가까워질까?", "tags": "#수리 #자원순환 #꽃동전 #나선지대 #펩시티", "one": "고장 난 물건을 같이 고치고 만들면서, 졸업하면 떠나던 청년과 동네 사이를 잇습니다.", "why": ["연구기관과 대학이 모인 과학도시지만, 장비와 기술은 기관 안에 있어 시민이 일상에서 쓰기 어렵습니다.", "유성구 어은동은 카이스트·충남대 인근 대학가로, 청년이 살다가 졸업과 함께 떠나기도 하는 동네입니다."], "meet": ["시민은 병뚜껑을 모아 꽃동전으로 바꾸고, 참여 가게에서 사용합니다.", "수리 모임 ‘수선스런사람들’에서 고장 난 물건을 함께 고치고 아는 것을 나눕니다.", "‘메이킹데이’에서 만들고 싶은 것을 직접 만들어 봅니다."], "inv": "만남과 연결의 공간 나선지대를 유지하고, 집에서 고쳐 보는 ‘새로고침키트’를 새롭게 시험하며, 청년들과 동네 이야기 굿즈를 만듭니다.", "links": "jaejagso.com · @jaejagso", "page": "12", "url": "https://makehope.org/sd-interview/?bmode=view&idx=156496957", "photo": "images/sd_jaejakso.jpg"}, {"id": "chaeum", "track": "y", "n": "03", "team": "청년채움", "reg": "서울 구로구", "who": "이학준", "q": "동네 카페와 책방이 도시 청년의 고립을 막을 수 있을까?", "tags": "#소셜살롱 #느슨한연결 #생활권 #동네친구 #외로움", "one": "동네 카페와 책방을 빌려 소셜살롱을 열고, 혼자 지내던 청년이 사는 동네에서 아는 얼굴을 만들 수 있게 합니다.", "why": ["산업화와 노동의 역사, 오류동 피난민 정착의 기억, 새 업무지구가 함께 있어 동네마다 이야기가 다릅니다.", "오래된 가게와 책방, 골목이 이미 있어 새 공간 없이도 청년과 동네를 이을 수 있습니다."], "meet": ["청년은 소셜살롱에 참여하고, 다음 모임을 직접 제안하기도 합니다.", "동네 가게와 책방은 모임 장소를 내주고, 오래 산 주민은 동네의 옛이야기를 들려줍니다."], "inv": "새 운영진과 함께 단체를 다시 세웁니다. 활동가가 들인 시간, 소셜살롱·소모임 운영, 참여자 사이의 관계가 이어지는지를 기록하고 확인하는 체계를 만듭니다.", "links": "chaeumyouth.or.kr · @chae.um_youth", "page": "14", "url": "https://makehope.org/sd-interview/?bmode=view&idx=113326820", "photo": "images/sd_chaeum.jpg"}, {"id": "touch", "track": "y", "n": "04", "team": "터치제주", "reg": "제주", "who": "양지원", "q": "제주 어르신, 왜 스마트폰 배워도 혼자 쓰기 어려울까?", "tags": "#디지털소외 #시니어 #키오스크 #제주맞춤 #배리어프리", "one": "교육이 끝나면 다시 스마트폰을 혼자 쓰기 어려워지는 어르신을 위해, 제주 생활에 맞춘 디지털 교재와 키오스크 연습 앱을 만듭니다.", "why": ["제주 공공 와이파이, 도청 홈페이지, 버스 정보처럼 전국 공통 교재로는 배울 수 없는, 도민이 매일 쓰는 서비스가 있습니다.", "도심 밖에서는 프랜차이즈 매장 키오스크보다 어르신이 실제로 다니는 동네 가게와 시설에 맞춘 교육이 필요합니다."], "meet": ["어르신의 경험과 의견을 교재와 앱에 반영합니다.", "복지관은 참여자와 공간을 연결하고, 지역 카페와는 실습 협력을 추진합니다."], "inv": "팀원의 개발 역량을 키우고, 연습 콘텐츠를 다른 카페와 생활시설, 택시 호출로 넓힙니다.", "links": "@touchjeju25", "page": "16", "url": "https://makehope.org/sd-interview/?bmode=view&idx=168866111", "photo": "images/sd_touch.jpg"}, {"id": "gorae", "track": "y", "n": "05", "team": "52헤르츠고래들", "reg": "전북 남원", "who": "강미선", "q": "가족에 기댈 수 없을 때, 청년은 어디서 삶을 시작할 수 있을까?", "tags": "#탈가정청년 #자립 #공동체 #고래 #연결", "one": "가족에게 기댈 수 없는 탈가정 청년이 남원에서 함께 살며 관계를 쌓고, 자립을 준비할 수 있게 합니다.", "why": ["주거비가 낮아, 당장의 생존에 쫓기던 청년에게 미래를 계획할 시간이 생기는 인구감소지역입니다.", "규모가 작아 소개 한 번이면 귀향한 사람, 예술가 등 다양한 삶을 만날 수 있습니다."], "meet": ["청년은 지역말을 기록하는 인터뷰어이자 ‘우덜말 상회’의 기획자로 어르신을 만납니다.", "청년은 자신의 재능과 관심을 살려 ‘고래 살롱’에서 강사가 됩니다."], "inv": "탈가정 청년에게 급하게 필요한 병원비·이사비·차비를 마련합니다. 단기 살이를 늘리고, 다른 지역 단체와 교류하고, 운영 매뉴얼을 정리하는 데도 씁니다.", "links": "@52hz_gorae", "page": "18", "url": "https://makehope.org/sd-interview/?bmode=view&idx=174919454", "photo": "images/sd_gorae.jpg"}, {"id": "botam", "track": "l", "n": "01", "team": "㈜보탬플러스", "reg": "충북 충주", "who": "김재원", "q": "원도심에 들어와 오래 머물려면 무엇이 필요할까?", "tags": "#원도심 #도시재생 #웜플레이스 #골목상권 #관아골", "one": "비어 가는 원도심 관아골에 새로 들어온 사람이 자리 잡을 수 있도록, 빈 공간을 운영하고 단계별 정착 경로를 만듭니다.", "why": ["관아골은 충주 시내동의 중심이었지만, 10여 개 공공기관이 옮겨 가며 사람 발길이 줄었습니다.", "도보 25~30분 안에 역사와 상권, 빈 공간이 모여 있어 작은 시도로도 변화가 보입니다."], "meet": ["관아골에서 가게와 작업실을 꾸린 동네친구들이 직접 활동하며 소유주와 들어올 사람 사이를 잇습니다.", "시민은 담장마켓과 관아골 소풍 등 동네 행사에서 만납니다.", "연 100여 팀이 전국에서 관아골을 방문해 문제해결 경험을 나눕니다."], "inv": "‘첫 책상, 첫 가게, 첫 집’ 경로를 위해 공유오피스, 수리비·보증금을 돕는 작은 기금, 정착 기록에 씁니다.", "links": "botemplus.net · @botemplus_official", "page": "22", "url": "https://makehope.org/sd-interview/?bmode=view&idx=168970805", "photo": "images/sd_botam.jpg"}, {"id": "farmnd", "track": "l", "n": "02", "team": "팜앤디협동조합", "reg": "전남 곡성", "who": "서동선", "q": "인구가 줄어드는 곳에서 머물며 일할 수 있을까?", "tags": "#러스틱타운 #워케이션 #AI뽀각캠프 #유휴공간 #농촌커뮤니티", "one": "인구가 줄어드는 곡성에서 일하며 살 수 있는 조건을 만듭니다. 도시 사람이 머물다 가는 워케이션 거점과, 주민이 AI로 자기 일을 바꿔 보는 캠프를 운영합니다.", "why": ["고령화율 40% 이상의 인구감소지역으로, 정책 재원은 내려오지만 공공 시설을 운영할 주체가 적습니다.", "KTX로 서울에서 2시간 30분 거리라 도시 사람이 며칠씩 머물다 갈 수 있습니다.", "빈집, 한옥, 옛 학교처럼 운영으로 살릴 공공 자산이 많습니다."], "meet": ["도시 시민은 3박 4일 ‘포레스트캠프’로 곡성에 머물며 일합니다. 식사를 제공하지 않아 방문객이 자연스럽게 지역 식당과 상점을 이용합니다.", "곡성 주민은 AI 뽀각캠프에서 자기 일을 바꿔 보고 전후를 기록합니다.", "곡성 이야기를 담은 온라인 매거진 「농담」으로 도시 독자와 만납니다."], "inv": "곡성 중·고등학생이 동네 문제를 AI로 풀어 보는 청소년 해커톤 첫 회를 2027년 겨울방학에 엽니다.", "links": "rustictown.co.kr · farmnd.co.kr", "page": "24", "url": "https://makehope.org/sd-interview/?bmode=view&idx=113326914", "photo": "images/sd_farmnd.jpg"}, {"id": "baram", "track": "l", "n": "03", "team": "사회적협동조합 바람개비마을", "reg": "경남 남해", "who": "전경선", "q": "나이 들어도 살던 마을에 계속 살 수 없을까?", "tags": "#마을공동체 #농촌돌봄 #인생하숙집 #바람개비 #세대연결", "one": "병들면 살던 마을을 떠나야 하는 문제를, 주민이 함께 꾸리는 마을 돌봄으로 풀어 가고 있습니다.", "why": ["초고령 마을이지만 이웃 간의 끈끈한 유대가 살아 있어, 주민 스스로 돌봄을 꾸릴 수 있는 곳입니다.", "교통과 생활 여건이 도시와 달라 획일적인 복지 제도와 대규모 요양시설이 잘 맞지 않습니다."], "meet": ["주민이 직접 인생하숙집을 운영하고 마을을 가꿉니다.", "마을회관 2층 ‘바람개비학교’에서 버려진 페트병으로 바람개비를 만들며 마을 활동이 시작됩니다. 이 학교의 교장은 초등학생입니다.", "초등학생부터 80대 어르신까지 마을 주민이 축제를 직접 기획하고 운영합니다."], "inv": "마을 안의 작은 요양원 ‘농어촌형 노인그룹홈’을 조성하기 위해 인생하숙집과 내동천상회의 공간과 운영 체계를 보강합니다.", "links": "@naedongcheon", "page": "26", "url": "https://makehope.org/sd-interview/?bmode=view&idx=173700561", "photo": "images/sd_baram.jpg"}, {"id": "liking", "track": "l", "n": "04", "team": "라이킹(딜리셔스라이프랩)", "reg": "제주", "who": "황희정", "q": "이주여성의 음식과 이야기가 지역에서 업이 될 수 있을까?", "tags": "#글로벌푸드텔러 #푸드텔링 #이주여성 #식문화 #소울푸드", "one": "다문화 이주여성이 고향 음식과 이야기를 전하는 푸드텔러로 활동하며, 제주에서 자기 역할과 일을 만들어 갑니다.", "why": ["‘도민’과 ‘이주민’을 구분하는 문화가 있고, 정착했다가 다시 떠나는 사람이 적지 않습니다.", "지역의 식재료와 식문화가 강해, 함께 먹는 일이 관계의 시작이 됩니다."], "meet": ["이주여성은 지원 대상이 아니라 강사이자 호스트로 시민 앞에 섭니다.", "시민의 질문과 구매 반응이 다음 메뉴와 프로그램을 바꿉니다."], "inv": "메뉴·제품과 유료 프로그램, 푸드텔러 활동비, 기업·기관 프로그램 시범 운영에 쓰고, 활동 횟수와 실제 수입을 기록합니다.", "links": "@liking_jeju", "page": "28", "url": "https://makehope.org/sd-interview/?bmode=view&idx=175101830", "photo": "images/sd_liking.jpg"}, {"id": "darori", "track": "l", "n": "05", "team": "㈜다로리인", "reg": "경북 청도", "who": "서삼열", "q": "아이 키우는 가족이 농촌에 남을 이유를 만들 수 있을까?", "tags": "#농촌돌봄 #마을학교 #마을호텔 #관계인구 #다로리마을", "one": "아이 키우는 가족과 어르신이 서로 기대며 살 수 있도록, 마을돌봄공동체를 꾸리고 빈집을 고쳐 다시 씁니다.", "why": ["대구·경산과 가까워 마을에서 아이를 키우면서도 도시의 의료와 문화 시설을 이용할 수 있습니다.", "돌봄기관과 문화 인프라는 읍내에 몰려 있어 면 단위에 방과 후 공백이 생깁니다."], "meet": ["마을학교 대표자는 정기 모임으로 사업에 의견을 냅니다.", "이장님과 어르신들이 빈집 주인과 직접 다리를 놓아 줍니다.", "어르신은 천원밥상과 자서전 쓰기에 참여합니다."], "inv": "아이들과 떠나는 평화기행, 직원과 마을학교 대표의 성장 여행, 빈집 숙소의 기자재에 씁니다.", "links": "@darori_in", "page": "30", "url": "https://makehope.org/sd-interview/?bmode=view&idx=167702148", "photo": "images/sd_darori.jpg"}];

        if (hide !== this.state.hide || cta !== this.state.cta) this.setState(hide ? { hide, cta, menu: false } : { hide, cta });
      }, { passive: true });
      let mx = null;
      document.addEventListener("mousedown", e => { mx = (e.target.closest && e.target.closest("[data-swipe]") && !e.target.closest("button")) ? e.clientX : null; });
      document.addEventListener("mouseup", e => { if (mx === null) return; const dx = e.clientX - mx; mx = null;
        if (Math.abs(dx) > 40) { const gn = GAL.length, g = this.state.g; this.setState({ g: (g + (dx < 0 ? 1 : -1) + gn) % gn }); } });
      let sx = null;
      document.addEventListener("touchstart", e => { sx = (e.target.closest && e.target.closest("[data-swipe]")) ? e.touches[0].clientX : null; }, { passive: true });
      document.addEventListener("touchend", e => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; sx = null;
        if (Math.abs(dx) > 40) { const gn = GAL.length, g = this.state.g; this.setState({ g: (g + (dx < 0 ? 1 : -1) + gn) % gn }); } }, { passive: true });
    }
  }
  renderVals() {
    const all = TEAMS.map((t, i) => ({ ...t, noPhoto: !t.photo, trackName: TRACK[t.track].name, accent: TRACK[t.track].accent, deep: TRACK[t.track].deep, open: () => this.setState({ open: i }) }));
    const o = this.state.open;
    const tab = this.state.tab;
    const n = all.length;
    const v = {
      youth: all.filter(t => t.track === "y"),
      local: all.filter(t => t.track === "l"),
      hasModal: o >= 0,
      m: o >= 0 ? all[o] : all[0],
      close: () => this.setState({ open: -1 }),
      prev: () => this.setState({ open: (o - 1 + n) % n }),
      next: () => this.setState({ open: (o + 1) % n })
    };
    try { document.body.style.overflow = o >= 0 ? "hidden" : ""; } catch (e) {}
    const mo = this.state.menu;
    v.menuOpen = mo; v.menuIcon = mo ? "✕" : "☰";
    v.toggleMenu = () => this.setState({ menu: !mo });
    v.closeMenu = () => this.setState({ menu: false });
    v.hdrY = this.state.hide && !mo ? "-100%" : "0px";
    v.ctaY = this.state.cta && o < 0 ? "0px" : "220%";
    const g = this.state.g, gn = GAL.length;
    v.galSrc = GAL[g]; v.galNo = g + 1; v.galTotal = gn;
    v.galPrev = () => this.setState({ g: (g - 1 + gn) % gn });
    v.galNext = () => this.setState({ g: (g + 1) % gn });
    v.gal = GAL.map((src, i) => ({ src, label: (i + 1) + "번째 사진 보기", ring: i === g ? "#1E8A44" : "transparent", op: i === g ? 1 : 0.6, go: () => this.setState({ g: i }) }));
    ["info", "site"].forEach(k => {
      v["on_" + k] = tab === k;
      v["bg_" + k] = tab === k ? "#0E4419" : "transparent";
      v["fg_" + k] = tab === k ? "#FFFFFF" : "#0E4419";
      v["tab_" + k] = () => this.setState({ tab: k });
    });
    return v;
  }
}

(function(){
const tplEl=document.getElementById('tpl');const app=document.getElementById('app');
const comp=new Component({});let H=[];let queued=false;
function look(scope,expr){expr=expr.trim();if(expr==='true')return true;if(expr==='false')return false;let v=scope;for(const k of expr.split('.')){if(v==null)return undefined;v=v[k];}return v;}
function sub(str,scope){return str.replace(/\{\{([^}]+)\}\}/g,(m,e)=>{const v=look(scope,e);return v==null?'':String(v);});}
function single(str){const m=/^\s*\{\{([^}]+)\}\}\s*$/.exec(str);return m?m[1]:null;}
function R(node,scope,out){
 if(node.nodeType===3){out.appendChild(document.createTextNode(sub(node.nodeValue,scope)));return;}
 if(node.nodeType!==1)return;
 const tag=node.localName;
 if(tag==='sc-for'){const list=look(scope,single(node.getAttribute('list')))||[];const as=node.getAttribute('as');list.forEach(it=>{const sc=Object.assign({},scope,{[as]:it});node.childNodes.forEach(c=>R(c,sc,out));});return;}
 if(tag==='sc-if'){if(look(scope,single(node.getAttribute('value'))))node.childNodes.forEach(c=>R(c,scope,out));return;}
 const el=node.namespaceURI&&node.namespaceURI!=='http://www.w3.org/1999/xhtml'?document.createElementNS(node.namespaceURI,node.tagName):document.createElement(tag);
 for(const a of node.attributes){
  if(a.name==='onclick'){const f=look(scope,single(a.value));if(typeof f==='function'){H.push(f);el.setAttribute('data-click',H.length-1);}continue;}
  if(a.name.startsWith('hint-'))continue;
  el.setAttribute(a.name,sub(a.value,scope));
 }
 node.childNodes.forEach(c=>R(c,scope,el));out.appendChild(el);
}
function morph(a,b){
 if(a.nodeType===3){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;return;}
 for(const at of [...a.attributes]){if(!b.hasAttribute(at.name)&&!(at.name==='open'&&a.localName==='details'))a.removeAttribute(at.name);}
 for(const at of b.attributes){if(a.getAttribute(at.name)!==at.value)a.setAttribute(at.name,at.value);}
 const ac=[...a.childNodes],bc=[...b.childNodes];
 bc.forEach((bn,i)=>{const an=ac[i];if(!an){a.appendChild(bn);}else if(an.nodeType===bn.nodeType&&an.nodeName===bn.nodeName&&(an.nodeType===1||an.nodeType===3)){morph(an,bn);}else{a.replaceChild(bn,an);}});
 for(let i=bc.length;i<ac.length;i++)a.removeChild(ac[i]);
}
function render(){queued=false;H=[];const frag=document.createElement('div');const v=comp.renderVals();tplEl.content.childNodes.forEach(c=>R(c,v,frag));morph(app,frag);}
window.schedule=function(){if(!queued){queued=true;requestAnimationFrame(render);}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-click]');if(t){const f=H[+t.getAttribute('data-click')];if(f)f(e);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&comp.state.open>=0)comp.setState({open:-1});});
render();
})();

</script>
